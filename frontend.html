<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEXUS — AI Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0f; --surface:#111118; --border:#1e1e2e;
      --accent:#00ffc8; --accent2:#7b61ff; --text:#e8e8f0;
      --muted:#555570; --user-bg:#1a1a2e; --bot-bg:#0f1520;
      --radius:14px; --font-ui:'Syne',sans-serif; --font-mono:'Space Mono',monospace;
    }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font-ui); overflow:hidden; }
    body::before {
      content:''; position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-size:200px 200px; pointer-events:none; z-index:0;
    }
    body::after {
      content:''; position:fixed; inset:0;
      background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
      background-size:40px 40px; opacity:0.4; pointer-events:none; z-index:0;
    }
    .app { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; max-width:820px; margin:0 auto; padding:0 16px; }
    header { display:flex; align-items:center; justify-content:space-between; padding:20px 0 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
    .logo { display:flex; align-items:center; gap:12px; }
    .logo-icon { width:36px; height:36px; border:1.5px solid var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; animation:pulse-border 3s ease-in-out infinite; }
    .logo-icon svg { width:18px; height:18px; }
    @keyframes pulse-border { 0%,100%{box-shadow:0 0 0 0 rgba(0,255,200,0.3)} 50%{box-shadow:0 0 0 6px rgba(0,255,200,0)} }
    .logo-text { font-weight:800; font-size:1.15rem; letter-spacing:0.12em; }
    .logo-text span { color:var(--accent); }
    .status { display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:0.7rem; color:var(--muted); }
    .status-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .clear-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:6px; cursor:pointer; font-family:var(--font-mono); font-size:0.65rem; letter-spacing:0.05em; transition:all 0.2s; }
    .clear-btn:hover { border-color:var(--accent); color:var(--accent); }
    .messages { flex:1; overflow-y:auto; padding:24px 0 8px; display:flex; flex-direction:column; gap:4px; scroll-behavior:smooth; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
    .messages::-webkit-scrollbar { width:4px; }
    .messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
    .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:40px 20px; }
    .empty-icon { width:64px; height:64px; border:1.5px solid var(--border); border-radius:16px; display:flex; align-items:center; justify-content:center; color:var(--accent); opacity:0.6; }
    .empty-title { font-weight:700; font-size:1.4rem; }
    .empty-sub { font-family:var(--font-mono); font-size:0.75rem; color:var(--muted); line-height:1.6; }
    .suggestion-chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px; }
    .chip { padding:8px 14px; border:1px solid var(--border); border-radius:100px; cursor:pointer; font-size:0.78rem; color:var(--muted); transition:all 0.2s; background:var(--surface); }
    .chip:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
    .msg-row { display:flex; gap:12px; align-items:flex-end; animation:slide-in 0.3s ease forwards; opacity:0; transform:translateY(10px); padding:4px 0; }
    @keyframes slide-in { to{opacity:1;transform:translateY(0)} }
    .msg-row.user { flex-direction:row-reverse; }
    .avatar { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:0.65rem; font-weight:700; }
    .avatar.bot { background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#000; }
    .avatar.user { background:var(--user-bg); border:1px solid var(--border); color:var(--muted); }
    .bubble { max-width:72%; padding:12px 16px; border-radius:var(--radius); font-size:0.9rem; line-height:1.65; }
    .bubble.bot { background:var(--bot-bg); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .bubble.user { background:var(--user-bg); border:1px solid #2a2a42; border-bottom-right-radius:4px; }
    .bubble-meta { display:flex; justify-content:flex-end; margin-top:6px; }
    .bubble-time { font-family:var(--font-mono); font-size:0.6rem; color:var(--muted); }
    .typing-row { display:flex; gap:12px; align-items:flex-end; padding:4px 0; }
    .typing-bubble { background:var(--bot-bg); border:1px solid var(--border); border-radius:var(--radius); border-bottom-left-radius:4px; padding:14px 16px; display:flex; gap:5px; align-items:center; }
    .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:0.4; animation:bounce 1.2s ease-in-out infinite; }
    .dot:nth-child(2){animation-delay:0.2s} .dot:nth-child(3){animation-delay:0.4s}
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-5px);opacity:1} }
    .input-area { padding:14px 0 20px; flex-shrink:0; border-top:1px solid var(--border); }
    .input-wrapper { display:flex; align-items:flex-end; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px 10px 10px 16px; transition:border-color 0.2s; }
    .input-wrapper:focus-within { border-color:var(--accent); }
    textarea { flex:1; background:none; border:none; outline:none; color:var(--text); font-family:var(--font-ui); font-size:0.9rem; line-height:1.5; resize:none; max-height:120px; min-height:22px; }
    textarea::placeholder { color:var(--muted); }
    .send-btn { width:36px; height:36px; border-radius:9px; background:var(--accent); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; color:#000; }
    .send-btn:hover { background:#00e6b4; transform:scale(1.05); }
    .send-btn:active { transform:scale(0.97); }
    .send-btn:disabled { background:var(--border); color:var(--muted); cursor:default; transform:none; }
    .send-btn svg { width:16px; height:16px; }
    .input-footer { display:flex; justify-content:flex-end; padding:6px 2px 0; }
    .hint { font-family:var(--font-mono); font-size:0.6rem; color:var(--muted); }
    .bubble pre { background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:12px; margin:8px 0; overflow-x:auto; font-family:var(--font-mono); font-size:0.78rem; line-height:1.5; color:#79c0ff; }
    .bubble code { font-family:var(--font-mono); font-size:0.82em; background:rgba(0,255,200,0.08); color:var(--accent); padding:1px 5px; border-radius:4px; }
    .bubble pre code { background:none; color:#79c0ff; padding:0; }
    @media(max-width:600px){ .bubble{max-width:88%} .logo-text{font-size:1rem} }
  </style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00ffc8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <span class="logo-text">NEX<span>US</span></span>
    </div>
    <div class="status"><div class="status-dot"></div>ONLINE</div>
    <button class="clear-btn" onclick="clearChat()">CLEAR</button>
  </header>

  <div class="messages" id="messages">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/>
          <path d="M12 8v4l3 3"/>
        </svg>
      </div>
      <div class="empty-title">How can I help?</div>
      <div class="empty-sub">Connected to your Express backend.<br/>Type a message or try a suggestion below.</div>
      <div class="suggestion-chips">
        <div class="chip" onclick="sendChip(this)">Say hello</div>
        <div class="chip" onclick="sendChip(this)">What can you do?</div>
        <div class="chip" onclick="sendChip(this)">Tell me a joke</div>
        <div class="chip" onclick="sendChip(this)">How are you?</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="input" placeholder="Message NEXUS…" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="input-footer">
      <span class="hint">Enter to send &nbsp;·&nbsp; Shift+Enter for newline</span>
    </div>
  </div>

</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send-btn');
  const emptyState = document.getElementById('empty-state');

  let isLoading = false;

  // ── Input wiring ──────────────────────────────────────
  inputEl.addEventListener('input', () => {
    sendBtn.disabled = !inputEl.value.trim() || isLoading;
  });

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  }

  function sendChip(el) {
    inputEl.value = el.textContent;
    autoResize(inputEl);
    sendBtn.disabled = false;
    sendMessage();
  }

  // ── Clear ─────────────────────────────────────────────
  function clearChat() {
    messagesEl.querySelectorAll('.msg-row, .typing-row').forEach(r => r.remove());
    emptyState.style.display = 'flex';
  }

  // ── Send ──────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    emptyState.style.display = 'none';
    appendMessage('user', text);

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    isLoading = true;

    const typingRow = showTyping();
    scrollToBottom();

    try {
      const response = await fetch('http://localhost:3000/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      typingRow.remove();

      if (!response.ok) throw new Error(`Server error: ${response.status}`);

      const data = await response.json();
      appendMessage('bot', data.reply || '*(no reply)*');

    } catch (err) {
      typingRow.remove();
      appendMessage('bot', `⚠️ **Error:** ${err.message}`);
    }

    isLoading = false;
    sendBtn.disabled = !inputEl.value.trim();
    scrollToBottom();
  }

  // ── Helpers ───────────────────────────────────────────
  function appendMessage(role, text) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'bot' ? 'AI' : 'ME';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.innerHTML = formatText(text);

    const meta = document.createElement('div');
    meta.className = 'bubble-meta';
    const time = document.createElement('span');
    time.className = 'bubble-time';
    time.textContent = getTime();
    meta.appendChild(time);
    bubble.appendChild(meta);

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'typing-row';
    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = 'AI';
    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    return row;
  }

  function formatText(text) {
    let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,lang,code) => `<pre><code>${code.trim()}</code></pre>`);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/\n/g, '<br>');
    return s;
  }

  function getTime() {
    return new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
</script>
</body>
</html>
